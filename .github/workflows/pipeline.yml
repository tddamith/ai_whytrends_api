name: Trend pipeline

on:
  schedule:
    - cron: "7,37 * * * *" # every 30 minutes, off the hour to avoid the busy top-of-hour slot
  workflow_dispatch: {}

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          WEB_REVALIDATE_URL: ${{ vars.WEB_REVALIDATE_URL }}
          WEB_REVALIDATE_SECRET: ${{ secrets.WEB_REVALIDATE_SECRET }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'review' }}
          MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN || '4' }}
          TRENDS_GEO: US
